<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mochi · Back to your thing</title>
<!--
  Self-contained, transparent, dependency-free overlay. Plays once in 32 seconds.
  Peek / hello / play / please / sniff / boop / paws / takeover / goodbye.
  Preview: ?bg=1&debug=1. Space pauses, R replays, 1–9 jump to a beat.
  ?speed=2 accelerates playback. RobotOverlay.seek(seconds) allows precise review.
  Completion preserves the host's babyOverlay/finish message contract.
-->
<style>

  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  #safe { position: fixed; inset: var(--menu-clearance) 0 var(--dock-clearance); overflow: hidden; pointer-events: none; isolation: isolate; }
  #scene { display: block; width: 100%; height: 100%; opacity: 0; }
  #safe.ready #scene { opacity: 1; }
  #safe.ready #fallback { display: none; }
  #safe.done { opacity: 0; transition: opacity .55s ease; }
  #speech, #handoff { position: absolute; left: 50%; margin: 0; opacity: 0; text-align: center; will-change: transform, opacity; }
  #speech { top: 13%; width: max-content; max-width: calc(100% - 36px); padding: 12px 21px 14px; border: 1px solid #fff7; border-radius: 23px 23px 23px 7px; color: #273941; background: #fffdf5f5; box-shadow: 0 5px 0 #99b5b329, 0 12px 32px #15252c22; font-size: clamp(16px, 2vw, 23px); font-weight: 650; letter-spacing: -.035em; }

  #handoff strong { display: block; font-size: clamp(23px, 3.4vw, 39px); font-weight: 750; letter-spacing: -.055em; line-height: 1.08; }
  #handoff small { display: block; margin-top: 9px; font-size: 13px; color: #697b7c; }
  #glass { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 47%, #e5fffa21, transparent 56%); }
  .ripple { position: absolute; left: 50%; top: 45%; width: 100px; height: 100px; margin: -50px; border: 2px solid #baf6ed; border-radius: 50%; opacity: 0; box-shadow: 0 0 16px #abefdf33, inset 0 0 16px #abefdf22; }

  .fb-ear { position: absolute; top: -34px; width: 43px; height: 65px; border: 8px solid #e8ece3; border-radius: 24px 24px 10px 10px; background: #c1b5d5; }
  .fb-ear.left { left: 15px; transform: rotate(-22deg); }
  .fb-ear.right { right: 12px; transform: rotate(28deg); }
  .fb-face { position: absolute; inset: 19px 12px 13px; border-radius: 37px; background: linear-gradient(150deg, #263f47, #0c1c26); }
  .fb-face::before, .fb-face::after { content: ""; position: absolute; top: 23px; width: 22px; height: 35px; border-radius: 12px; background: #baffec; box-shadow: 0 0 12px #a2ffdb66; }
  .fb-face::before { left: 31px; } .fb-face::after { right: 31px; }
  .fb-nose { position: absolute; left: 70px; top: 62px; width: 18px; height: 12px; border-radius: 6px 6px 10px 10px; background: #ffb5b9; }
  #fallback p { position: absolute; top: 147px; left: -60px; width: 300px; padding: 14px; margin: 0; border-radius: 20px; background: #fffdf7; color: #253b40; font-size: 20px; text-align: center; }
  #preview { display: none; position: fixed; inset: 0; z-index: -1; padding: 8vh 8vw; color: #718380; background: #15252a; }
  #preview header { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
  #preview h1 { margin: 17vh 0 20px; max-width: 600px; font-size: clamp(35px, 6vw, 80px); line-height: 1.04; letter-spacing: -.06em; font-weight: 500; color: #afc0b8; }
  #preview p { max-width: 360px; font-size: 14px; line-height: 1.8; }
  #hud { display: none; position: fixed; left: 14px; bottom: 18px; color: #dcf7e9; font: 11px/1.7 ui-monospace, monospace; white-space: pre-line; background: #13292be8; padding: 9px 14px; border: 1px solid #7cb09c33; border-radius: 12px; pointer-events: none; }
  @media (max-height: 550px) { :root { --menu-clearance: 16px; --dock-clearance: 38px; } #handoff { padding: 12px 18px; } #handoff small { margin-top: 5px; } }

</head>
<body>
<div id="preview" aria-hidden="true"><header><span>mochi / attention companion</span><span>animation study 01</span></header><h1>You had a thing<br>you wanted to make.</h1><p>A little company for getting back to it.<br>Watch what happens when you keep ignoring him.</p></div>
<div id="safe" role="img" aria-label="A little robot puppy waves, bows, sniffs the camera, and presses its paws against the glass to coax you back to work.">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="glass" aria-hidden="true"></div>
  <div class="ripple" aria-hidden="true"></div><div class="ripple" aria-hidden="true"></div><div class="ripple" aria-hidden="true"></div>
  <div class="heart" aria-hidden="true">♥</div><div class="heart" aria-hidden="true">♥</div><div class="heart" aria-hidden="true">♥</div>
  <div id="fallback" aria-hidden="true"><div class="fb-head"><i class="fb-ear left"></i><i class="fb-ear right"></i><div class="fb-face"><i class="fb-nose"></i></div></div><p>Come on. Back to your thing.</p></div>
  <p id="speech" aria-hidden="true"></p>
  <div id="handoff" aria-hidden="true"><span>Okay, you've got company</span><strong>Back to your thing.</strong><small>I'll come with you.</small></div>
</div>
<output id="hud" aria-hidden="true"></output>
<script>

    draw(shape,mul(parent,matrix(x,y,z,rx,ry,rz,sx,sy,sz)),c,e,a,rough);
  }
  function link(parent,a,b,width,c=cream,emission=0,shape=sphere) {

  // screen-relative; moving forward changes nose and paw perspective as well.
  const staging=[
    [0,.57,-.32,.72,-.13,-.48],[1.35,.40,-.29,.76,-.22,-.25],
    [2.2,.40,-.29,.76,-.22,-.25],[3.2,.30,-.15,.93,.08,.12],
    [5.7,.27,-.14,.93,-.08,-.1],[7,.12,-.08,1.02,.05,.24],
    [9.4,.08,-.08,1.02,.02,0],[11.3,0,.02,1.28,-.09,0],
    [13.3,0,.02,1.28,.1,-.1],[16.5,-.07,.03,2.16,-.08,.13],
    [17.8,.04,.015,2.65,.06,-.09],[18.65,0,.015,4.2,0,0],
    [19.15,0,.015,3.35,-.035,0],[20.8,0,.015,3.4,.045,0],
    [22.8,0,.05,3.9,-.02,0],[24.8,0,.05,3.9,.02,0],
    [26.5,0,.08,4.9,-.025,0],[29.7,0,.08,4.9,.025,0],
    [30.8,0,.06,3.2,-.08,0],[32,0,-1.1,1.5,.18,.15]

    part(box,head,0,-.025,.589,1.43,.82,.11,glass,0,0,0,0,1,.14);
    part(sphere,head,-.26,.305,.655,.65,.025,.009,[.3,.47,.46],0,0,.04,.2);
    for(const side of [-1,1]) {
      const settle=Math.sin((t-6.35)*17)*Math.exp(-Math.max(0,t-6.35)*3)*phase(t,6.2,6.35)*.18;
      const lag=Math.sin(t*3.6-side*.9)*.045+settle,flop=side===1?-.34+.13*Math.sin(t*3.1-.7):0;

      part(sphere,ear,0,.16,0,.46,.62,.38,cream);part(sphere,ear,0,.19,.189,.275,.36,.055,lilac);
      part(sphere,head,side*.875,-.025,-.02,.18,.34,.38,joint);part(sphere,head,side*.953,-.025,0,.075,.20,.23,trim);
      eye(head,side,t,a);
    }
    part(sphere,head,0,-.123,.678,.155+a.boop*.035,.105-a.boop*.018,.105,pink,0,0,0,.1);
    part(sphere,head,-.024,-.101,.723,.040,.019,.012,white,0,0,0,.7);
    contacts[0]=screenPoint(head,[0,-.123,.73]);
    const mouth=[];
    for(let i=0;i<13;i++){const x=(i/12-.5)*.29;mouth.push([x,-.25+.058*Math.pow(Math.abs(x)/.145,2),.651]);}
    curve(head,mouth,.023,mint,.8);
    const lick=envelope(t,19.25,19.42,19.7,19.9);
    if(lick>.001)part(sphere,head,.045,-.26+lick*.06,.682,.092,.15*lick,.035,pink,0,0,-.3,.25);
    const waveWiggle=Math.sin((t-3.6)*13)*.12*a.wave;
    const left=[mix(-.72,-.27,a.beg),mix(-.54,-.35,a.beg)-a.bow*.10,.30+a.beg*.28];
    const right=[mix(.72,.94,a.wave)*(1-a.beg*.62),mix(-.54,.63,a.wave)+waveWiggle-a.beg*.04,.3+a.wave*.06+a.beg*.28];
    for(const side of [-1,1]) {
      const hand=side<0?left:right,tap=pulse(t,22.75+(side>0?.55:0),.16)+pulse(t,24+(side>0?.35:0),.16);
      hand[0]=mix(hand[0],side*(.76-a.takeover*.18),a.paws);hand[1]=mix(hand[1],.19+a.takeover*.30+Math.sin(t*2+side)*.018,a.paws);
      hand[2]=mix(hand[2],.88+tap*.05,a.paws);paw(parent,side,hand,a.paws);
      contacts[side<0?1:2]=screenPoint(parent,[hand[0],hand[1],hand[2]+.16]);
    }
  }
  function overlays(t,a) {
    const captions=[[2.9,5.8,'oh, hi.'],[9.9,13.3,'ahem. your thing?'],[15,17.6,'are you in there?'],[19,20.8,'boop.'],[22.2,24.9,'these paws mean business.']];
    let opacity=0;
    for(const [start,end,label] of captions)if(t>=start&&t<=end){opacity=envelope(t,start,start+.3,end-.3,end);speech.textContent=label;}
    const near=phase(t,12.8,14.3),nose=contacts[0];
    speech.style.left=`${mix(clamp(nose[0]-S,130,W-130),W/2,near)}px`;
    speech.style.top=`${mix(clamp(nose[1]-S*1.65,24,H-90),H*.10,near)}px`;
    speech.style.opacity=opacity;speech.style.transform=`translate(-50%, ${8*(1-opacity)}px) rotate(${-2*opacity}deg)`;
    const h=envelope(t,25.6,26.1,31,31.7);handoff.style.opacity=h;handoff.style.transform=`translate(-50%, ${20*(1-h)}px) scale(${.94+.06*h})`;
    $('glass').style.opacity=a.paws*.7;
    [18.65,22.75,23.3].forEach((start,i)=>{
      const q=clamp((t-start)/.85),el=ripples[i];el.style.left=`${contacts[i][0]}px`;el.style.top=`${contacts[i][1]}px`;
      el.style.opacity=t>=start&&q<1?(1-q)*.7:0;el.style.transform=`scale(${.25+q*2.7})`;
    });
    hearts.forEach((el,i)=>{
      const start=19.25+i*.18,q=clamp((t-start)/1.5);el.style.opacity=t>=start?Math.sin(q*PI)*.85:0;
      el.style.left=`${nose[0]}px`;el.style.top=`${nose[1]}px`;
      el.style.transform=`translate(${42+(i-1)*43+Math.sin(q*4+i)*12}px, ${-40-q*100}px) rotate(${(i-1)*18}deg) scale(${.55+q*.45})`;
    });
    if(debug){const beat=beats.reduce((n,b,i)=>t>=b?i:n,0);$('hud').textContent=`${t.toFixed(1)} / ${duration}s  ·  ${names[beat]}${paused?'  ·  paused':''}\n1–9 jump  ·  space pause  ·  R replay`;}
  }
  function render(t) {
    gl.depthMask(true);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(u.projection,false,projection);
    const a=acting(t);robot(pose(t,a),t,a);overlays(t,a);
    if(!safe.classList.contains('ready')){if(gl.getError()!==gl.NO_ERROR)throw Error('Could not render overlay');safe.classList.add('ready');}
  }
  function frame(now) {
    if(finished||disposed||paused||!primary)return;
    time+=Math.max(0,now-previous)/1000*speed;previous=now;if(time>=duration){finish();return;}
    try{render(time);raf=requestAnimationFrame(frame);}catch{fallback();}
  }
  function pause(){if(disposed||finished)return;paused=true;cancelAnimationFrame(raf);clearTimeout(deadline);if(primary)render(time);}
  function play(){if(disposed||finished)return;paused=false;previous=performance.now();armDeadline();cancelAnimationFrame(raf);if(primary)raf=requestAnimationFrame(frame);else fallback();}
  function seek(seconds){if(disposed||finished)return;const next=Number(seconds);if(!Number.isFinite(next))return;time=clamp(next,0,duration-.01);previous=performance.now();armDeadline();if(primary)render(time);}
  function replay(){if(debug&&(disposed||finished)){location.reload();return;}if(!disposed&&!finished){seek(0);play();}}
  function keys(event){
    if(!debug||event.metaKey||event.ctrlKey||event.altKey)return;
    if(event.code==='Space'){event.preventDefault();paused?play():pause();}
    if(event.key.toLowerCase()==='r')replay();if(/^[1-9]$/.test(event.key)){pause();seek(beats[Number(event.key)-1]+.6);}
  }
  window.RobotOverlay=Object.freeze({pause,play,seek,replay,phases:names,get time(){return time;}});
  window.addEventListener('keydown',keys);
  if(motion.matches){fallback();return;}
  function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){gl.deleteShader(s);throw Error('Overlay shader unavailable');}return s;}
  try {
    gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:true,depth:true,powerPreference:'low-power'});if(!gl)throw Error('WebGL unavailable');
    const vs=shader(gl.VERTEX_SHADER,`
      attribute vec3 aPosition,aNormal;uniform mat4 uModel,uProjection;uniform mat3 uNormal;varying vec3 vNormal,vWorld;
      void main(){vec4 p=uModel*vec4(aPosition,1.);vWorld=p.xyz;vNormal=normalize(uNormal*aNormal);p.z-=1000.;gl_Position=uProjection*p;}

      precision mediump float;uniform vec4 uColor;uniform float uEmission,uRoughness;varying vec3 vNormal,vWorld;
      void main(){
        vec3 n=normalize(vNormal),v=normalize(vec3(0.,0.,1000.)-vWorld);
        vec3 key=normalize(vec3(-.65,1.1,1.6)),fill=normalize(vec3(1.,.25,.7));
        float diffuse=max(dot(n,key),0.),side=max(dot(n,fill),0.);
        float spec=pow(max(dot(n,normalize(key+v)),0.),mix(100.,22.,uRoughness)),rim=pow(1.-max(dot(n,v),0.),3.);
        vec3 light=vec3(.24,.29,.32)+vec3(.80,.76,.63)*diffuse+vec3(.16,.24,.23)*side;
        vec3 c=uColor.rgb*light+vec3(1.,.95,.8)*spec*(.23+.15*(1.-uRoughness))+vec3(.23,.36,.34)*rim*.34;
        c=mix(c,uColor.rgb,uEmission);c=pow(max(c,vec3(0.)),vec3(.88));gl_FragColor=vec4(c*uColor.a,uColor.a);

    program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.bindAttribLocation(program,0,'aPosition');gl.bindAttribLocation(program,1,'aNormal');
    gl.linkProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Overlay program unavailable');
    gl.useProgram(program);gl.enableVertexAttribArray(0);gl.enableVertexAttribArray(1);
    for(const name of ['model','projection','normal','color','emission','roughness'])u[name]=gl.getUniformLocation(program,'u'+name[0].toUpperCase()+name.slice(1));
    box=rounded();sphere=mesh(grid(24,16,(u,v)=>{const a=u*PI*2,b=v*PI,n=[Math.sin(b)*Math.cos(a),Math.cos(b),Math.sin(b)*Math.sin(a)];return [...n.map(x=>x*.5),...n];}));
    tube=mesh(grid(16,1,(u,v)=>{const a=u*PI*2;return [Math.cos(a)*.5,v-.5,Math.sin(a)*.5,Math.cos(a),0,Math.sin(a)];}));
    gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

  }catch{fallback();}
})();
