<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script>
      // A WebGL pet with a WebAssembly helper: the fragment shader draws a
      // psychedelic plasma, and psych.wasm supplies the per-frame warp factor.
      // Swap psych.wasm for anything compiled from Rust/C/Zig; only the
      // exported function name below is the contract.
      const canvas = document.querySelector("canvas");
      const gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: false });
      const shader = (type, source) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER, `
        attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform float t, warp; uniform vec2 size;
        void main() {
          vec2 uv = (gl_FragCoord.xy - 0.5 * size) / min(size.x, size.y);
          float r = length(uv), a = atan(uv.y, uv.x);
          float v = sin(r * 12.0 * warp - t * 2.0) + sin(a * 5.0 + t) + sin((uv.x + uv.y) * 8.0 + t * 1.5);
          vec3 col = 0.5 + 0.5 * cos(v * 2.0 + vec3(0.0, 2.1, 4.2) + t);
          gl_FragColor = vec4(col, smoothstep(0.5, 0.2, r));
        }`));
      gl.linkProgram(program);
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const p = gl.getAttribLocation(program, "p");
      gl.enableVertexAttribArray(p);
      gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
      const u = (name) => gl.getUniformLocation(program, name);

      WebAssembly.instantiateStreaming(fetch("psych.wasm")).then(({ instance }) => {
        const { warp } = instance.exports;
        const frame = (ms) => {
          canvas.width = innerWidth; canvas.height = innerHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(u("size"), canvas.width, canvas.height);
          gl.uniform1f(u("t"), ms / 1000);
          gl.uniform1f(u("warp"), warp(0.5 + 0.25 * Math.sin(ms / 3000)));
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      }, (reason) => { document.body.textContent = String(reason); });
    </script>
  </body>
</html>
