[workspace]
members = [
    "crates/app-schema",
    "crates/module-host",
    "crates/module-host-macros",
    "crates/module-registry",
    "crates/seaolim",
    "crates/tauri-graphql-transport",
    "crates/web-server",
    "modules/*/rust",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
async-graphql = "=7.0.19"
async-graphql-axum = "=7.0.19"
axum = "=0.8.9"
clap = { version = "=4.6.6", features = ["derive"] }
futures-util = "=0.3.32"
heck = "=0.5.0"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }
reqwest = { version = "=0.13.4", default-features = false }
sea-orm = { version = "=2.0.1", features = ["runtime-tokio-rustls", "seaography", "sqlx-sqlite"] }
sea-orm-migration = { version = "=2.0.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
seaography = { version = "=2.0.0-rc.9", default-features = false, features = ["field-camel-case"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri = "=2.11.5"
taurpc = "=0.8.2"
tempfile = "=3.23.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Pinned to the version the async-graphql axum integration already links, so
# the test client speaks to the server over one WebSocket implementation.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
tower-http = { version = "=0.6.11", default-features = false }
